name: Community Watch Request

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  handle-watch-request:
    if: ${{ startsWith(github.event.issue.title, 'Watch request:') && !endsWith(github.event.sender.login, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and add requested URL
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python - << 'PY'
          import json, os, re, subprocess, sys

          body = os.environ.get("ISSUE_BODY", "")
          title = os.environ.get("ISSUE_TITLE", "")
          match = re.search(r"https://[^\s)>\"']+", body)
          if not match:
              print("ADDED=false")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("added=false\nreason=No https:// URL found in the issue body.\n")
              sys.exit(0)

          url = match.group(0).rstrip(".,;:")
          custom_name = ""
          if ":" in title:
              cand = title.split(":", 1)[1].strip()
              if cand and "<page name>" not in cand:
                  custom_name = cand

          cmd = ["python", "scripts/update_ledger.py", "--add-url", url]
          if custom_name:
              cmd.extend(["--name", custom_name])
          proc = subprocess.run(cmd, capture_output=True, text=True)
          out_line = (proc.stdout.strip().splitlines() or ["{}"])[-1]
          try:
              res = json.loads(out_line)
          except json.JSONDecodeError:
              res = {"added": False, "reason": proc.stderr.strip() or out_line or "Unexpected script error."}

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"added={'true' if res.get('added') else 'false'}\n")
              fh.write(f"url={url}\n")
              fh.write(f"slug={res.get('slug', '')}\n")
              fh.write(f"reason={res.get('reason', '').replace(chr(10), ' ')}\n")
          PY

      - name: Run ledger tests
        if: ${{ steps.add.outputs.added == 'true' }}
        run: python -m unittest -v scripts/test_ledger.py

      - name: Commit and push watchlist update
        if: ${{ steps.add.outputs.added == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add community watch URL (${{ steps.add.outputs.slug }})"
          git push

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ADDED: ${{ steps.add.outputs.added }}
          REQ_URL: ${{ steps.add.outputs.url }}
          REASON: ${{ steps.add.outputs.reason }}
        run: |
          if [ "$ADDED" = "true" ]; then
            MSG="Added \`$REQ_URL\` to the HistDiff watchlist! It is now live on https://rcarloc.github.io/histdiff-ledger-v02/watchlist.html and will be checked twice daily. You can also compare past Wayback captures immediately at https://apify.com/accommodating_fuel/histdiff."
          else
            MSG="Could not add \`$REQ_URL\` automatically: $REASON"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "$MSG"
