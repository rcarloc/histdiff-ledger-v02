name: Daily Fresh-Change Watch

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      sync_candidates:
        description: "Sync any new candidate URLs into watchlist from US runner"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync candidate watchlist URLs (if requested)
        if: ${{ inputs.sync_candidates }}
        run: python scripts/update_ledger.py --sync-candidates

      - name: Check watched pages and rebuild ledger
        run: python scripts/update_ledger.py

      - name: Run ledger tests
        run: python -m unittest -v scripts/test_ledger.py

      - name: Commit and push updated ledger
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fresh-change watch update"
          git push
